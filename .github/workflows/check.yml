name: audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recorded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/shared_artifacts.py --offline
      - run: python -m unittest discover -s tests
      - run: python tools/check_recorded.py
  references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python tools/shared_artifacts.py --offline
      - run: |
          python -m venv .venv-python
          python -m venv .venv-cpp
          .venv-python/bin/python -m pip install -r environments/python.txt
          .venv-cpp/bin/python -m pip install -r environments/cpp.txt
          python tools/compare.py --reference .venv-python/bin/python --candidate .venv-cpp/bin/python --output results/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-observations
          path: results/ci

  native-interface:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      # Update deliberately with the upstream interface/compiler migration.
      HGRAPH_REVISION: 0e33040ba70f2fb361ae843275de24ff2b0075ed
      CC: gcc-14
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify recorded native interface inputs
        run: python compiler/native_interfaces/check.py
      - name: Install the pinned Rust formatter
        run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compiler build dependencies
        run: python -m pip install "cmake==4.4.2" "ninja==1.13.0" "pyarrow==25.0.0"
      - name: Fetch the pinned upstream compiler
        run: |
          git init "$RUNNER_TEMP/hgraph"
          git -C "$RUNNER_TEMP/hgraph" fetch --depth 1 https://github.com/hhenson/hgraph.git "$HGRAPH_REVISION"
          git -C "$RUNNER_TEMP/hgraph" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/hgraph" rev-parse HEAD)" = "$HGRAPH_REVISION"
      - name: Build the upstream compiler
        run: |
          cmake -S "$RUNNER_TEMP/hgraph" -B "$RUNNER_TEMP/hgraph-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DHGRAPH_BUILD_LANGUAGE=ON -DHGRAPH_BUILD_PYTHON_BINDINGS=OFF \
            -DHGRAPH_ENABLE_PYTHON_USER_NODES=OFF -DHGRAPH_ENABLE_IDE_PYTHON_HEADER_HINTS=OFF \
            -DHGRAPH_USE_PYARROW_ARROW=ON -DHGRAPH_ENABLE_COMPILER_CACHE=OFF \
            -DPython_EXECUTABLE="$(command -v python)"
          cmake --build "$RUNNER_TEMP/hgraph-build" --target hgl --parallel 2
      - name: Check shared inputs and generated Rust interfaces
        run: >-
          python compiler/native_interfaces/check.py
          --upstream "$RUNNER_TEMP/hgraph"
          --compiler "$RUNNER_TEMP/hgraph-build/language/hgl"
